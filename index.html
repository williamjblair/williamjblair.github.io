    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>William Blair</title>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        // The CV became the About page. Leave before anything renders, and skip the page transition
        // this document would otherwise start, so the redirect does not abort it mid-flight.
        if (path === "/cv") {
          addEventListener("pagereveal", function (event) {
            if (event.viewTransition) {
              event.viewTransition.ready.catch(function () {});
              event.viewTransition.skipTransition();
            }
          });
          location.replace("/about/");
          return;
        }
        // The homepage and About open at night: paint the dark before React so there is no flash of paper.
        if (path === "" || path === "/about") document.documentElement.classList.add("is-home");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
